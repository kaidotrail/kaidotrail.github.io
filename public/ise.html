  <body>
    <!-- prettier-ignore -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-MTM7SMZG"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <a href="./" class="logo-link"><img src="lib/logo160.png" alt="旧街道足跡マップ" /></a>
    <h1>
      <a href="./"><span class="logo-font">旧街道足跡マップ</span></a>
      <span class="sep">&gt;</span>
      <span id="route-entry">伊勢街道</span>
      <span id="select-entry"></span>
    </h1>
    <div id="map"></div>
    <div id="own-gpx" class="non-map-screen"></div>
    <script>
      const map = createMap(L);
      const routeOverlay = L.layerGroup();
      routeOverlay.addTo(map);
      const stationOverlay = L.layerGroup();
      stationOverlay.addTo(map);
      const spotOverlay = L.layerGroup();
      spotOverlay.addTo(map);
      const gpxOverlay = L.layerGroup();
      gpxOverlay.addTo(map);
      const layerControl = initMap(L, map, {
        宿場: stationOverlay,
        見どころ: spotOverlay,
        おすすめ歩行ルート: routeOverlay,
        "kagaorange の足跡": gpxOverlay,
      });
      activateJinsokuMap(L, layerControl);
      activateKonjakuMap(L, layerControl, "chukyo", "2man");
      activateKonjakuMap(L, layerControl, "tsu", "2man");

      // Stations
      const stations = [
        { name: "日永の追分", coordinate: [34.9355656, 136.5982157] },
        { name: "神戸", coordinate: [34.883782, 136.580275] }, // 道路元標
        { name: "白子", coordinate: [34.832039, 136.592325] }, // 高札場跡
        { name: "上野", coordinate: [34.791263, 136.545787] }, // 弘法井戸
        { name: "津", coordinate: [34.719696, 136.512808] }, // 道標 (津観音入口)
        { name: "雲出", coordinate: [34.651429, 136.515904] }, // 明治天皇島貫御小休所址
        { name: "松阪", coordinate: [34.578514, 136.530197] }, // 本町交差点
        { name: "櫛田", coordinate: [34.546291, 136.586439] }, // 里程標
        { name: "外宮", coordinate: [34.487649, 136.706661] }, // 表参道入口
        { name: "内宮", coordinate: [34.458938, 136.722884] }, // 宇治橋鳥居外側
      ];
      const stationLayer = L.featureGroup();
      setMarkers(L, stationOverlay, stationLayer, stations);
      initQueryParamUpdater(map, () => map.fitBounds(stationLayer.getBounds()));

      // Spots
      const spots = [];
      initSpots(L, map, spotOverlay, spots);

      // Route
      L.polyline(iseRoute, { color: "red", weight: 5 })
        .addTo(routeOverlay)
        .bindPopup("おすすめ歩行ルート");

      // GPX
      setGpx(
        L,
        gpxOverlay,
        "gpx/kagaorange_2026-09-22.gpx",
        "blue",
        "kagaorange の足跡 (2026/9/22〜24 日永→内宮)",
      );
    </script>
